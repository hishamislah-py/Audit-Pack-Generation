# nginx on :80 in front of the analyst application server on loopback (127.0.0.1:8780, the only address it binds).
# The server itself serves the validated React UI (/analyst/), its API (/api/) and its own security headers (CSP,
# X-Frame-Options), so nginx only proxies. "/" opens the analyst application.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100m;
    # Relative redirects: behind the HTTPS edge (other host/port/scheme) an absolute http://host/ URL would be wrong.
    absolute_redirect off;

    location = / {
        return 302 /analyst/;
    }

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
