# nginx serves the built frontend; /api is proxied to uvicorn on loopback. The backend only accepts loopback clients
# (uc042app/api/main.py, LOCAL_ONLY), which holds because nginx and uvicorn share this container and uvicorn runs
# with --no-proxy-headers (uvicorn trusts X-Forwarded-For from 127.0.0.1 by default); nginx also drops that header.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100m;
    root /app/web;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
